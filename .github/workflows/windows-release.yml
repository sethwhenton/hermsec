name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to build and publish. It must resolve to the checked-out commit."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # Unsigned development build; production signing is intentionally not claimed.
      ELECTRON_CACHE: ${{ github.workspace }}\.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.electron-builder-cache
      npm_config_audit: "false"
      npm_config_fund: "false"
      PMG_DISABLE_TELEMETRY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag matches checkout
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          $tagCommit = (git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}").Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) {
            throw "Release tag $env:RELEASE_TAG resolves to $tagCommit, not checked-out commit $headCommit."
          }

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Enable Visual C++ build environment for portable scanner launchers
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Setup exact uv runtime bundler
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.10.12"

      - name: Install dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm --prefix desktop ci --ignore-scripts

      - name: Rebuild approved install-script dependencies
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm --prefix desktop rebuild esbuild --ignore-scripts=false
            if ($LASTEXITCODE -eq 0) {
              npm --prefix desktop run setup:electron
            }
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            $status = $LASTEXITCODE
            Write-Host "approved dependency rebuild failed with exit code $status on attempt $attempt."
            if ($attempt -eq 3) {
              exit $status
            }
            Start-Sleep -Seconds ($attempt * 15)
          }

      - name: Typecheck root harness
        run: npm run typecheck

      - name: Typecheck desktop app
        run: npm --prefix desktop run typecheck

      - name: Run root tests
        run: npm test

      - name: Run desktop packaging and runtime tests
        run: npm --prefix desktop test

      - name: Build Windows app
        run: npm --prefix desktop run dist:win

      - name: Run desktop smoke checks
        run: |
          npm --prefix desktop run smoke:doctor
          npm --prefix desktop run smoke:dashboard

      - name: Normalize Windows filenames
        shell: pwsh
        run: |
          $releaseDir = "desktop\release"
          $installer = Get-ChildItem -Path $releaseDir -Filter "Hermsec Setup *.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            throw "No Windows installer was produced."
          }
          Copy-Item -LiteralPath $installer.FullName -Destination "$releaseDir\Hermsec-Setup-Windows-x64.exe" -Force

          $portable = Get-ChildItem -Path $releaseDir -Filter "Hermsec *.exe" |
            Where-Object { $_.Name -notlike "Hermsec Setup *" -and $_.Name -notlike "Hermsec-Setup-*" -and $_.Name -notlike "Hermsec-Portable-*" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $portable) {
            throw "No Windows portable executable was produced."
          }
          Copy-Item -LiteralPath $portable.FullName -Destination "$releaseDir\Hermsec-Portable-Windows-x64.exe" -Force

          Get-ChildItem $releaseDir | Format-Table Name, Length, LastWriteTime

      - name: Smoke unpacked, portable, and installed NSIS executables
        shell: pwsh
        run: |
          $unpacked = Resolve-Path "desktop\release\win-unpacked\Hermsec.exe"
          $portable = Resolve-Path "desktop\release\Hermsec-Portable-Windows-x64.exe"
          $installer = Resolve-Path "desktop\release\Hermsec-Setup-Windows-x64.exe"

          node desktop/scripts/smoke-packaged-runtime.mjs --app $unpacked.Path
          if ($LASTEXITCODE -ne 0) {
            throw "The unpacked Hermsec runtime smoke failed."
          }

          # The portable SFX owns its temporary extraction directory, so its
          # in-app Doctor proves the bundled CLI/scanners while the unpacked
          # and installed forms receive the additional relocated-tree probe.
          node desktop/scripts/smoke-packaged-runtime.mjs --app $portable.Path --portable-sfx
          if ($LASTEXITCODE -ne 0) {
            throw "The actual portable Hermsec executable smoke failed."
          }

          $installRoot = Join-Path $env:RUNNER_TEMP "hermsec-nsis-smoke"
          $localAppData = Join-Path $installRoot "LocalAppData"
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $installRoot, $localAppData | Out-Null
          $env:LOCALAPPDATA = $localAppData

          $install = Start-Process -FilePath $installer.Path -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent NSIS installation failed with exit code $($install.ExitCode)."
          }
          $installed = Get-ChildItem -LiteralPath $installRoot, $localAppData -Filter "Hermsec.exe" -File -Recurse |
            Where-Object { $_.FullName -notlike "*\Uninstall Hermsec.exe" } |
            Select-Object -First 1
          if (-not $installed) {
            throw "Installed Hermsec executable was not found after the silent NSIS install."
          }

          node desktop/scripts/smoke-packaged-runtime.mjs --app $installed.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "The installed NSIS Hermsec executable smoke failed."
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Hermsec-Windows-x64
          path: |
            desktop/release/Hermsec-Setup-Windows-x64.exe
            desktop/release/Hermsec-Portable-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Windows Release Assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag matches checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "Release tag ${RELEASE_TAG} resolves to ${tag_commit}, not checked-out commit ${head_commit}."
            exit 1
          fi

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-assets

      - name: Create release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## Hermsec Desktop

          Download the installer for your platform from the release assets.

          - **Windows:** use `Hermsec-Setup-Windows-x64.exe`, or `Hermsec-Portable-Windows-x64.exe` for portable mode.
          - **macOS Apple Silicon:** use `Hermsec-macos-arm64.dmg` from the macOS release workflow.
          - **macOS Intel:** use `Hermsec-macos-x64.dmg` from the macOS release workflow.

          These are unsigned development builds. They are not production-signed releases.

          After installing, open Hermsec and run `/doctor` from chat to verify bundled scanners, internet connectivity, and provider configuration.
          NOTES

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f -name '*.exe' | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No Windows release assets found."
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            gh release edit "${RELEASE_TAG}" --notes-file release-notes.md --title "Hermsec ${RELEASE_TAG}"
          else
            if ! gh release create "${RELEASE_TAG}" "${assets[@]}" --title "Hermsec ${RELEASE_TAG}" --notes-file release-notes.md; then
              gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
              gh release edit "${RELEASE_TAG}" --notes-file release-notes.md --title "Hermsec ${RELEASE_TAG}"
            fi
          fi

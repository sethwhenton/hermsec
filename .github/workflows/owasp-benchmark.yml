name: OWASP BenchmarkJava

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/agent/**"
      - "src/core/**"
      - "src/eval/**"
      - "src/scanners/**"
      - "scripts/eval-owasp-benchmark.mjs"
      - "package.json"
      - "package-lock.json"

jobs:
  benchmark-java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Clone OWASP BenchmarkJava
        run: |
          mkdir -p .hermsec-benchmarks
          git clone --depth 1 https://github.com/OWASP-Benchmark/BenchmarkJava.git .hermsec-benchmarks/BenchmarkJava

      - name: Run Hermsec OWASP gate
        run: npm run eval:owasp -- --mode offline --min-recall 0.80 --min-precision 0.55

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-benchmarkjava-results
          path: .hermsec/benchmark-runs/owasp-benchmarkjava-ci/**

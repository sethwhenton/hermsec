name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            package_script: dist:win
            artifact_name: hermsec-windows-x64
            artifact_paths: |
              v2/hermsec-v3/release/*.exe
              v2/hermsec-v3/release/*.blockmap
              v2/hermsec-v3/release/latest*.yml
          - label: macOS
            os: macos-latest
            package_script: dist:mac
            artifact_name: hermsec-macos
            artifact_paths: |
              v2/hermsec-v3/release/*.dmg
              v2/hermsec-v3/release/*.zip
              v2/hermsec-v3/release/*.blockmap
              v2/hermsec-v3/release/latest*.yml

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
      npm_config_audit: "false"
      npm_config_fund: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            v2/hermsec-v3/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv runtime bundler
        run: python -m pip install --upgrade uv

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: v2/hermsec-v3
        run: npm ci

      - name: Typecheck root harness
        run: npm run typecheck

      - name: Typecheck desktop app
        working-directory: v2/hermsec-v3
        run: npm run typecheck

      - name: Package desktop app
        working-directory: v2/hermsec-v3
        run: npm run ${{ matrix.package_script }}

      - name: Upload ${{ matrix.label }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag_name }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## Hermsec Desktop

          Download the installer for your platform from the assets below.

          - **Windows:** use `Hermsec Setup *.exe` for the installer or `Hermsec *.exe` for portable mode.
          - **macOS:** download the `.dmg`, open it, and drag Hermsec into Applications. The app is currently unsigned unless signing secrets are configured, so macOS may require approving it from System Settings > Privacy & Security on first launch.

          After installing, open Hermsec and run `/doctor` from chat to verify bundled scanners, internet connectivity, and provider configuration.
          NOTES

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets found."
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            gh release edit "${RELEASE_TAG}" --notes-file release-notes.md --title "Hermsec ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" --title "Hermsec ${RELEASE_TAG}" --notes-file release-notes.md
          fi

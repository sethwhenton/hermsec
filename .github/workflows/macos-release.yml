name: Build macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to build and publish. It must resolve to the checked-out commit."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            arch: arm64
            runner: macos-15
            package_script: dist:mac:arm64
            asset_name: Hermsec-macos-arm64.dmg
          - label: Intel
            arch: x64
            runner: macos-15-intel
            package_script: dist:mac:x64
            asset_name: Hermsec-macos-x64.dmg

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # Unsigned development build; production signing is intentionally not claimed.
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
      npm_config_audit: "false"
      npm_config_fund: "false"

      PMG_DISABLE_TELEMETRY: "true"

    steps:

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag matches checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "Release tag ${RELEASE_TAG} resolves to ${tag_commit}, not checked-out commit ${head_commit}."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Setup exact uv runtime bundler
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.10.12"

      - name: Install dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm --prefix desktop ci --ignore-scripts

      - name: Rebuild approved install-script dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm --prefix desktop rebuild esbuild --ignore-scripts=false && npm --prefix desktop run setup:electron && exit 0
            status=$?
            echo "approved dependency rebuild failed with exit code ${status} on attempt ${attempt}."
            if [[ "${attempt}" == "3" ]]; then
              exit "${status}"
            fi
            sleep $((attempt * 15))
          done

      - name: Typecheck root harness
        run: npm run typecheck

      - name: Typecheck desktop app
        run: npm --prefix desktop run typecheck

      - name: Run root tests
        run: npm test

      - name: Run desktop packaging and runtime tests
        run: npm --prefix desktop test

      - name: Build macOS app
        run: npm --prefix desktop run ${{ matrix.package_script }}

      - name: Run desktop smoke checks
        run: |
          npm --prefix desktop run smoke:doctor
          npm --prefix desktop run smoke:dashboard

      - name: Smoke packaged macOS runtime without system Node
        shell: bash
        run: |
          app="$(find desktop/release -type f -path '*.app/Contents/MacOS/Hermsec' -print -quit)"
          if [[ -z "${app}" ]]; then
            echo "No packaged Hermsec macOS executable was produced."
            exit 1
          fi
          node desktop/scripts/smoke-packaged-runtime.mjs --app "${app}"

      - name: Smoke released DMG artifact
        shell: bash
        run: |
          dmg="$(find desktop/release -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "${dmg}" ]]; then
            echo "No DMG was produced."
            exit 1
          fi
          mountpoint="$(mktemp -d "${RUNNER_TEMP:-/tmp}/hermsec-dmg-smoke.XXXXXX")"
          cleanup() {
            hdiutil detach "${mountpoint}" -quiet >/dev/null 2>&1 || true
            rmdir "${mountpoint}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "${dmg}" -nobrowse -readonly -mountpoint "${mountpoint}"
          app="$(find "${mountpoint}" -type f -path '*.app/Contents/MacOS/Hermsec' -print -quit)"
          if [[ -z "${app}" ]]; then
            echo "The mounted DMG does not contain a Hermsec app executable."
            exit 1
          fi
          node desktop/scripts/smoke-packaged-runtime.mjs --app "${app}"

      - name: Normalize DMG filename
        shell: bash
        run: |
          dmg="$(find desktop/release -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "${dmg}" ]]; then
            echo "No DMG was produced."
            exit 1
          fi
          cp "${dmg}" "desktop/release/${{ matrix.asset_name }}"
          ls -lh desktop/release

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.asset_name }}
          path: desktop/release/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 14

  linux-runtime-gate:
    name: Gate Linux x64 Portable Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # Unsigned development build; production signing is intentionally not claimed.
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
      npm_config_audit: "false"
      npm_config_fund: "false"


      PMG_DISABLE_TELEMETRY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag matches checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "Release tag ${RELEASE_TAG} resolves to ${tag_commit}, not checked-out commit ${head_commit}."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Setup exact uv runtime bundler
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.10.12"

      - name: Start PMG package guard
        uses: safedep/pmg@cb34b76fbcd1d1d517b1c0922b32d0ecf3f0e4a2
        with:
          server-mode: true

      - name: Install dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm --prefix desktop ci --ignore-scripts

      - name: Rebuild approved install-script dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm --prefix desktop rebuild esbuild --ignore-scripts=false && npm --prefix desktop run setup:electron && exit 0
            status=$?
            echo "approved dependency rebuild failed with exit code ${status} on attempt ${attempt}."
            if [[ "${attempt}" == "3" ]]; then
              exit "${status}"
            fi
            sleep $((attempt * 15))
          done

      - name: Run desktop packaging and runtime tests
        run: npm --prefix desktop test

      - name: Build Linux x64 portable-runtime gate
        run: npm --prefix desktop run dist:linux

      - name: Smoke packaged Linux runtime without system Node or Python
        shell: bash
        run: |
          app="$(find desktop/release -type f -path '*linux-unpacked/*' \( -name 'hermsec' -o -name 'Hermsec' \) -print -quit)"
          if [[ -z "${app}" ]]; then
            echo "No packaged Hermsec Linux executable was produced."
            exit 1
          fi
          node desktop/scripts/smoke-packaged-runtime.mjs --app "${app}"

      - name: Enforce PMG policy
        if: always()
        run: pmg proxy stop --fail-on-violation

  publish:
    name: Publish macOS Release Assets
    needs: [build, linux-runtime-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag matches checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "Release tag ${RELEASE_TAG} resolves to ${tag_commit}, not checked-out commit ${head_commit}."
            exit 1
          fi

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-assets

      - name: Create release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## Hermsec Desktop

          Download the installer for your platform from the release assets.

          - **macOS Apple Silicon:** use `Hermsec-macos-arm64.dmg`.
          - **macOS Intel:** use `Hermsec-macos-x64.dmg`.
          - **Windows:** use `Hermsec-Setup-Windows-x64.exe` from the Windows release workflow.

          These are unsigned development builds, not production-signed releases. On first launch, approve Hermsec from System Settings > Privacy & Security if macOS blocks it.

          After installing, open Hermsec and run `/doctor` from chat to verify bundled scanners, internet connectivity, and provider configuration.
          NOTES

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f -name '*.dmg' | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No macOS release assets found."
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            gh release edit "${RELEASE_TAG}" --notes-file release-notes.md --title "Hermsec ${RELEASE_TAG}"
          else
            if ! gh release create "${RELEASE_TAG}" "${assets[@]}" --title "Hermsec ${RELEASE_TAG}" --notes-file release-notes.md; then
              gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
              gh release edit "${RELEASE_TAG}" --notes-file release-notes.md --title "Hermsec ${RELEASE_TAG}"
            fi
          fi
